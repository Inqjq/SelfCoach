server:
  port: 8080

spring:
  application:
    name: selfcoach

  # 数据库连接（Phase 0 第 2 步：接入云服务器 PostgreSQL 16 + pgvector）
  # 连接信息全部走环境变量，凭据不进代码库。
  # 选项 A：后端与数据库在同一台云服务器，故默认连 localhost:5432。
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:selfcoach}
    username: ${DB_USER:selfcoach}
    password: ${DB_PASSWORD:selfcoach}

# LLM / Embedding 接入（阿里云百炼，OpenAI 兼容协议）。
# key 严格走环境变量，绝不写进代码库；base-url 可按你的区域调整。
llm:
  base-url: ${BAILIAN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${BAILIAN_API_KEY:}
  embedding-model: ${EMBEDDING_MODEL:qwen3.7-text-embedding-flash}
  chat-model: ${CHAT_MODEL:qwen3.8-flash}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.selfcoach: debug