services:
  # PostgreSQL 16 + pgvector：一个库同时管结构化数据与向量数据
  postgres:
    image: pgvector/pgvector:pg16
    container_name: selfcoach-postgres
    environment:
      POSTGRES_USER: selfcoach
      POSTGRES_PASSWORD: selfcoach
      POSTGRES_DB: selfcoach
    # 只绑定回环地址，避免把数据库端口暴露到公网（安全）
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selfcoach -d selfcoach"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # SelfCoach 后端（Spring Boot + WebFlux，选项 A：与数据库同居）
  backend:
    build: ./backend
    container_name: selfcoach-backend
    depends_on:
      postgres:
        condition: service_healthy
    # 连接信息用环境变量注入（凭据不进镜像；这里用的是默认开发值）
    environment:
      - DB_HOST=postgres      # 容器间通过 docker 网络用服务名互连
      - DB_PORT=5432
      - DB_NAME=selfcoach
      - DB_USER=selfcoach
      - DB_PASSWORD=selfcoach
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Langfuse 可观测平台（Phase 3 引入，先注释占位）
  # langfuse:
  #   image: langfuse/langfuse:2
  #   ...

volumes:
  pgdata: